name: Smoke Test

on:
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - uses: supabase/setup-cli@03559d0a6c2f0163187cadab1412d6dce3a6a481 # node24-compatible (post-v1.6.0)
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Export Supabase credentials for foreman
        run: |
          STATUS=$(supabase status 2>&1)
          # Supabase CLI v2+: sb_secret_* key format (same "shared defaults" for all installs)
          KEY=$(echo "$STATUS" | grep -o 'sb_secret_[A-Za-z0-9_-]*')
          # Fallback: older CLI JWT service_role key
          if [ -z "$KEY" ]; then
            KEY=$(echo "$STATUS" | grep 'service_role' | awk '{print $NF}')
          fi
          {
            echo "BRUNEL_SUPABASE_URL=http://127.0.0.1:54321"
            echo "BRUNEL_SUPABASE_SECRET_KEY=${KEY}"
          } >> "$GITHUB_ENV"

      - run: npm ci

      - run: npm run smoke
        env:
          CI: true
