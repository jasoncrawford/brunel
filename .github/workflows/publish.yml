name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write  # required for npm provenance (OIDC trusted publishing)

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - run: npm install -g npm@latest  # npm 11.5.1+ required for OIDC trusted publishing

      - run: npm ci

      - run: npm run build

      - run: npm publish --provenance
