name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Export Supabase credentials for tests
        run: |
          STATUS=$(supabase status 2>&1)
          # Supabase CLI v2+: sb_secret_* key format (same "shared defaults" for all installs)
          KEY=$(echo "$STATUS" | grep -o 'sb_secret_[A-Za-z0-9_-]*')
          # Fallback: older CLI JWT service_role key
          if [ -z "$KEY" ]; then
            KEY=$(echo "$STATUS" | grep 'service_role' | awk '{print $NF}')
          fi
          {
            echo "SUPABASE_URL=http://127.0.0.1:54321"
            echo "SUPABASE_SERVICE_ROLE_KEY=${KEY}"
          } >> "$GITHUB_ENV"

      - run: npm ci

      - run: npm test
        env:
          CI: true

      - run: npm run coverage
        if: always()

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - run: npx tsc --noEmit

      - run: npm run lint

      - name: Build frontend for browser tests
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
