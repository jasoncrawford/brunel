name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # node24-compatible (post-v1.6.0)
        with:
          version: latest

      - run: npm ci

      - name: Start local Supabase
        run: supabase start

      - name: Export Supabase credentials for tests
        run: |
          STATUS=$(supabase status 2>&1)
          # Supabase CLI v2+: sb_secret_* key format (same "shared defaults" for all installs)
          KEY=$(echo "$STATUS" | grep -o 'sb_secret_[A-Za-z0-9_-]*')
          # Fallback: older CLI JWT service_role key
          if [ -z "$KEY" ]; then
            KEY=$(echo "$STATUS" | grep 'service_role' | awk '{print $NF}')
          fi
          if [ -z "$KEY" ]; then
            echo "ERROR: Could not extract Supabase service role key from 'supabase status' output" >&2
            exit 1
          fi
          {
            echo "SUPABASE_URL=http://127.0.0.1:54321"
            echo "SUPABASE_SERVICE_ROLE_KEY=${KEY}"
          } >> "$GITHUB_ENV"

      - name: Run frontend component tests
        run: cd frontend && npm ci && npm test
        env:
          CI: true

      - run: npm run coverage

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - run: npx tsc --noEmit

      - run: npm run lint

      - name: Run worker-exit integration test
        run: npm run test:worker-exit

  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - run: npm ci

      - name: Build frontend for browser tests
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser
        env:
          CI: true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
